services:
  - type: web
    name: autor-copilot-publishing-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
